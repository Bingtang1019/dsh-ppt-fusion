name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unit tests never start the engine, the front end, or PowerPoint: every
      # process boundary is injected, so both platforms run the same suite.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      # Re-captures all 24 factory themes through the installed pptwise and diffs
      # them against fixtures/themes. Separate from `pnpm test` because 24
      # synchronous spawns block the test worker past vitest's RPC timeout.
      - name: Theme snapshot gate
        run: pnpm run themes:verify

      # Narration embedding reads audio durations with ffprobe, exactly as the engine
      # does, so the golden and matrix gates need ffmpeg on both legs.
      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      # The Python engine venv is built from python-assets/requirements.lock by
      # uv; `engine:provision` skips doctor's platform checks, whose png-renderer
      # row is red by design on hosts without cairo (ADR-020/025).
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.17'

      - name: Provision the engine venv
        env:
          DSH_PPT_UV: uv
        run: pnpm run engine:provision

      # Renders fixtures/hello through both engines plus the merge and compares the
      # result canonically (tier T1) against fixtures/golden.
      - name: Golden deck gate
        run: pnpm run fixtures:verify

      # Six representative presets rendered over the same deck; the snapshot covers
      # validate, the render receipt, canonical artifact fingerprints and the audit
      # report with the opt-in pixel (delta E) findings.
      - name: Theme matrix gate
        run: pnpm run matrix:verify

      # Rendering half of the compatibility matrix; the python-pptx half runs in
      # `compat:matrix` on both platforms.
      - name: Install LibreOffice Impress (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libreoffice-impress

      - name: Compatibility matrix
        run: pnpm run compat:matrix

      - name: Build the CLI bundle
        run: pnpm run build

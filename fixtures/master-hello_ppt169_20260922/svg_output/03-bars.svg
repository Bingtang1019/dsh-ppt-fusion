    <text x="320" y="596" font-family="Arial" font-size="22" fill="#5B6069">pptwise</text>
    <rect id="bar-deep" x="500" y="470" width="120" height="90" fill="#F5C518"/>
    <text x="528" y="452" font-family="Arial" font-size="22" font-weight="bold" fill="#1C1E23">9s</text>
    <text x="500" y="596" font-family="Arial" font-size="22" fill="#5B6069">deep render</text>
